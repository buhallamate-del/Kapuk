<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kapuk – Multiverzum RPG</title>
<style>
:root{--bg:#0c0b0a;--pan:rgba(16,14,12,.94);--bd:#6b5a3a;--bd2:#3a3226;--gold:#e6c47a;--tx:#e8dcc0;--dim:#a09478;--red:#e04848;--ok:#9fe07a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:var(--tx);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair}
.h{font-family:Georgia,"Times New Roman",serif;color:var(--gold);letter-spacing:.5px}
button{font:inherit;color:var(--tx);background:linear-gradient(#3a3020,#241d14);border:1px solid var(--bd);padding:6px 12px;border-radius:4px;cursor:pointer}
button:hover{border-color:var(--gold);color:#fff}button:disabled{opacity:.4;cursor:default}
button.sm{padding:2px 8px;font-size:12px}button.pri{background:linear-gradient(#6b4a1e,#3e2a10);border-color:var(--gold)}
input{font:inherit;background:#15120e;color:var(--tx);border:1px solid var(--bd);padding:6px 8px;border-radius:4px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud .int{pointer-events:auto}
#bars{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:10px}
.orb{width:92px;height:92px;border-radius:50%;border:2px solid var(--bd);background:#120e0c;position:relative;overflow:hidden;box-shadow:0 0 14px #000}
.orb .f{position:absolute;left:0;right:0;bottom:0;transition:height .15s}
.orb .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;text-shadow:0 1px 2px #000;font-size:12px}
.orb .t small{font-weight:400;font-size:10px;opacity:.85}
#mid{display:flex;flex-direction:column;gap:5px;align-items:center}
#skillbar{display:flex;gap:4px}
.sk{width:48px;height:48px;border:1px solid var(--bd);border-radius:5px;background:#17130f;position:relative;display:flex;align-items:center;justify-content:center;font-size:22px}
.sk .k{position:absolute;left:2px;top:0;font-size:10px;color:var(--dim)}.sk .n{position:absolute;right:2px;bottom:0;font-size:10px;color:#fff;text-shadow:0 0 2px #000}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7)}
.sk .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.sk.no{opacity:.45}.sk.forb{border-color:#ff3355;box-shadow:0 0 8px #ff335577}
#xp{width:420px;height:6px;background:#1c1712;border:1px solid var(--bd2);border-radius:3px;overflow:hidden}#xp div{height:100%;background:linear-gradient(90deg,#b08a2a,#ffd34d)}
#stab{width:420px;height:5px;background:#1c1712;border-radius:3px;overflow:hidden}#stab div{height:100%;background:#9fe07a}
#surv{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;font-size:11px}
.sv{display:flex;align-items:center;gap:6px}.sv b{width:16px;text-align:center}.sv .bar{width:110px;height:7px;background:#1c1712;border:1px solid var(--bd2);border-radius:3px;overflow:hidden}.sv .bar div{height:100%}
#quick{position:absolute;right:14px;bottom:14px;display:flex;gap:4px;align-items:flex-end}
#topl{position:absolute;left:14px;top:12px}#rname{font-size:18px}#rsub{color:var(--dim);font-size:12px}
#gold{position:absolute;right:14px;top:206px;color:#ffd34d;font-weight:700;text-shadow:0 1px 2px #000}
#mm{position:absolute;right:14px;top:12px;width:190px;height:190px;border:1px solid var(--bd);border-radius:4px;background:rgba(0,0,0,.55)}
#track{position:absolute;right:14px;top:230px;width:250px;font-size:12px;text-shadow:0 1px 2px #000}
#track .q{margin-bottom:6px}#track .q b{color:var(--gold)}#track .q.done b{color:var(--ok)}
#boss{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:520px;text-align:center;display:none}
#boss .nm{font-size:16px}#boss .ct{font-size:11px;color:var(--dim)}#boss .bar{height:12px;border:1px solid #803030;background:#1a0c0c;margin-top:4px}#boss .bar div{height:100%;background:linear-gradient(90deg,#801818,#e04848)}
#toasts{position:absolute;left:50%;top:84px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:720px}
.toast{background:rgba(10,8,6,.85);border:1px solid var(--bd2);border-radius:4px;padding:5px 12px;font-size:13px;text-align:center;animation:fi .2s}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}}
#chan{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);font-size:12px;color:var(--gold);text-shadow:0 1px 2px #000}
#wind{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);font-size:16px;color:#c48cff;font-weight:700;text-shadow:0 1px 3px #000}
#buffs{position:absolute;left:14px;top:62px;display:flex;gap:4px;flex-wrap:wrap;width:320px}
.bf{font-size:11px;background:rgba(0,0,0,.6);border:1px solid var(--bd2);border-radius:3px;padding:1px 5px}
#keys{position:absolute;left:14px;top:100px;color:#8a7f66;font-size:11px;line-height:1.5;text-shadow:0 1px 2px #000}
#scene{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}#scene.on{opacity:1}
#scene .sc-bar{position:absolute;left:0;right:0;top:0;height:9vh;background:#000}#scene .sc-bar.b{top:auto;bottom:0}
#scene .sc-t{position:absolute;left:50%;top:24vh;transform:translateX(-50%);width:min(680px,90vw);text-align:center;text-shadow:0 2px 6px #000;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,0) 70%);padding:14px 24px}
#scene .sc-x{font-size:15px;line-height:1.6;margin-top:6px;font-style:italic;color:#e8dcc0}
/* panelek */
.panel{position:fixed;background:var(--pan);border:1px solid var(--bd);border-radius:6px;box-shadow:0 10px 40px #000c;display:none;z-index:10}
.panel .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd2)}
.panel .hd .h{font-size:17px}.panel .bd{padding:10px 12px;overflow:auto;max-height:calc(100vh - 140px)}
.x{background:none;border:none;font-size:18px;color:var(--dim);padding:0 4px}
#pInv{right:14px;top:50px;width:470px}#pChar{left:14px;top:50px;width:380px}#pSkill{left:50%;top:40px;transform:translateX(-50%);width:820px}#pQuest{left:14px;top:50px;width:440px}
#pDlg{left:50%;top:50%;transform:translate(-50%,-50%);width:640px}#pMenu{left:50%;top:50%;transform:translate(-50%,-50%);width:440px}#pMap{left:50%;top:50%;transform:translate(-50%,-50%)}
#pShop{left:14px;top:50px;width:520px}
.grid{display:grid;grid-template-columns:repeat(8,52px);gap:4px}
.cell{width:52px;height:52px;border:1px solid var(--bd2);border-radius:4px;background:#14110d;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;cursor:pointer}
.cell:hover{border-color:var(--gold)}.cell .u{position:absolute;right:2px;bottom:0;font-size:10px;color:#fff}.cell .rq{position:absolute;left:2px;top:0;font-size:9px;color:#ff7a7a}
.eqg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.eqs{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--dim);gap:2px}
#tt{position:fixed;z-index:50;background:rgba(10,8,6,.97);border:1px solid var(--bd);border-radius:5px;padding:8px 10px;max-width:320px;pointer-events:none;display:none;font-size:12px}
#tt .tt-n{font-weight:700;font-size:14px}#tt .tt-s{color:var(--dim);font-size:11px;margin-bottom:4px}#tt .tt-b{font-weight:700}#tt .tt-g{color:var(--dim)}#tt .tt-a{color:#8fb8ff}#tt .tt-r{color:#e8a8ff;margin-top:4px}#tt .tt-req{margin-top:4px;color:var(--dim)}#tt .tt-v{color:#ffd34d;font-size:11px}
.up{color:var(--ok)}.down{color:#ff7a7a}.upg{color:#ffd34d}
.row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #2a241b}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}.tabs button.on{border-color:var(--gold);color:#fff;background:linear-gradient(#5a4320,#2e2212)}
.sktree{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skc.ut{border-color:#8a6a2a;background:#1c160c}.ar{color:#ff9a7a}.skc{border:1px solid var(--bd2);border-radius:5px;padding:8px;background:#14110d}.skc.lk{opacity:.5}.skc .t{display:flex;gap:8px;align-items:center}.skc .ic{font-size:24px}.skc .nm{font-weight:700}.skc .d{font-size:11px;color:var(--dim);margin:4px 0}
.dlg-txt{font-size:14px;line-height:1.55;margin:6px 0 12px;min-height:44px}.dlg-opts{display:flex;flex-direction:column;gap:5px}.dlg-opts button{text-align:left}
.port{width:56px;height:56px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:28px}
/* menü */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1424 0%,#07060a 70%);z-index:20;overflow-y:auto;padding:16px 0;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#menu .box{width:760px;max-width:calc(100vw - 32px);text-align:center;margin:auto}
#menu .title{font-size:64px;margin:0;text-shadow:0 0 30px #c48cff88}#menu .sub{color:var(--dim);margin-bottom:24px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.slot{border:1px solid var(--bd);border-radius:6px;padding:12px;background:rgba(16,14,12,.8);cursor:pointer;min-height:110px}.slot:hover{border-color:var(--gold)}
.clsg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0;text-align:left}
/* keskeny kijelző (telefon): két oszlop, a mentési helyek egymás alatt */
@media (max-width:760px){.clsg{grid-template-columns:repeat(2,minmax(0,1fr))}.slots{grid-template-columns:1fr}#menu .title{font-size:44px}#menu .sub{margin-bottom:12px}}
.cls{min-width:0;overflow-wrap:break-word;hyphens:auto;border:1px solid var(--bd2);border-radius:6px;padding:10px;background:rgba(16,14,12,.85);cursor:pointer;font-size:12px}.cls.on{border-color:var(--gold);box-shadow:0 0 12px #e6c47a55}.cls .i{font-size:30px}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:30;flex-direction:column;text-align:center}
.mbtn{min-width:52px}
.mat{display:inline-flex;align-items:center;gap:3px;margin:2px 6px 2px 0;font-size:12px}.mat i{width:9px;height:9px;display:inline-block;transform:rotate(45deg)}
.small{font-size:11px;color:var(--dim)}
.morse{font-size:30px;letter-spacing:6px;font-family:monospace;color:#4dffb0;text-align:center;margin:10px 0}
.hgrid{display:grid;gap:1px;background:#222;margin:auto}.hc{width:30px;height:30px;background:#2c2a24;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}.hc:hover{outline:1px solid var(--gold)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="scene"></div><div id="topl"><div id="rname" class="h"></div><div id="rsub"></div><div id="exped" style="color:#e6c47a;font-size:12px;margin-top:2px"></div></div>
  <div id="buffs"></div>
  <div id="keys"></div>
  <canvas id="mm" width="190" height="190"></canvas>
  <div id="gold"></div>
  <div id="track"></div>
  <div id="boss"><div class="nm h"></div><div class="ct"></div><div class="bar"><div></div></div></div>
  <div id="toasts"></div>
  <div id="chan"></div><div id="wind"></div>
  <div id="surv"></div>
  <div id="bars">
    <div class="orb" id="ohp"><div class="f" style="background:linear-gradient(#ff4a4a,#7a0c0c)"></div><div class="t"></div></div>
    <div id="mid"><div id="stab"><div></div></div><div id="skillbar"></div><div id="xp"><div></div></div></div>
    <div class="orb" id="omp"><div class="f"></div><div class="t"></div></div>
  </div>
  <div id="quick" class="int"></div>
</div>
<div id="pInv" class="panel"></div><div id="pChar" class="panel"></div><div id="pSkill" class="panel"></div><div id="pQuest" class="panel"></div>
<div id="pDlg" class="panel"></div><div id="pMenu" class="panel"></div><div id="pMap" class="panel"></div><div id="pShop" class="panel"></div>
<div id="tt"></div>
<div id="menu"></div>
<div id="over"></div>
<script type="module">
/*__SCRIPT__*/
</script>
</body>
</html>
