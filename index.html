<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kapuk – Multiverzum RPG</title>
<style>
:root{--bg:#0c0b0a;--pan:rgba(16,14,12,.94);--bd:#6b5a3a;--bd2:#3a3226;--gold:#e6c47a;--tx:#e8dcc0;--dim:#a09478;--red:#e04848;--ok:#9fe07a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:var(--tx);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair}
.h{font-family:Georgia,"Times New Roman",serif;color:var(--gold);letter-spacing:.5px}
button{font:inherit;color:var(--tx);background:linear-gradient(#3a3020,#241d14);border:1px solid var(--bd);padding:6px 12px;border-radius:4px;cursor:pointer}
button:hover{border-color:var(--gold);color:#fff}button:disabled{opacity:.4;cursor:default}
button.sm{padding:2px 8px;font-size:12px}button.pri{background:linear-gradient(#6b4a1e,#3e2a10);border-color:var(--gold)}
input{font:inherit;background:#15120e;color:var(--tx);border:1px solid var(--bd);padding:6px 8px;border-radius:4px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud .int{pointer-events:auto}
#bars{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:10px}
.orb{width:92px;height:92px;border-radius:50%;border:2px solid var(--bd);background:#120e0c;position:relative;overflow:hidden;box-shadow:0 0 14px #000}
.orb .f{position:absolute;left:0;right:0;bottom:0;transition:height .15s}
.orb .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;text-shadow:0 1px 2px #000;font-size:12px}
.orb .t small{font-weight:400;font-size:10px;opacity:.85}
#mid{display:flex;flex-direction:column;gap:5px;align-items:center}
#skillbar{display:flex;gap:4px}
.sk{width:48px;height:48px;border:1px solid var(--bd);border-radius:5px;background:#17130f;position:relative;display:flex;align-items:center;justify-content:center;font-size:22px}
.sk .k{position:absolute;left:2px;top:0;font-size:10px;color:var(--dim)}.sk .n{position:absolute;right:2px;bottom:0;font-size:10px;color:#fff;text-shadow:0 0 2px #000}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7)}
.sk .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.sk.no{opacity:.45}.sk.forb{border-color:#ff3355;box-shadow:0 0 8px #ff335577}
#xp{width:420px;height:6px;background:#1c1712;border:1px solid var(--bd2);border-radius:3px;overflow:hidden}#xp div{height:100%;background:linear-gradient(90deg,#b08a2a,#ffd34d)}
#stab{width:420px;height:5px;background:#1c1712;border-radius:3px;overflow:hidden}#stab div{height:100%;background:#9fe07a}
#surv{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;font-size:11px}
.sv{display:flex;align-items:center;gap:6px}.sv b{width:16px;text-align:center}.sv .bar{width:110px;height:7px;background:#1c1712;border:1px solid var(--bd2);border-radius:3px;overflow:hidden}.sv .bar div{height:100%}
#quick{position:absolute;right:14px;bottom:14px;display:flex;gap:4px;align-items:flex-end}
#topl{position:absolute;left:14px;top:12px}#rname{font-size:18px}#rsub{color:var(--dim);font-size:12px}
#gold{position:absolute;right:14px;top:206px;color:#ffd34d;font-weight:700;text-shadow:0 1px 2px #000}
#mm{position:absolute;right:14px;top:12px;width:190px;height:190px;border:1px solid var(--bd);border-radius:4px;background:rgba(0,0,0,.55)}
#track{position:absolute;right:14px;top:230px;width:250px;font-size:12px;text-shadow:0 1px 2px #000}
#track .q{margin-bottom:6px}#track .q b{color:var(--gold)}#track .q.done b{color:var(--ok)}
#boss{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:520px;text-align:center;display:none}
#boss .nm{font-size:16px}#boss .ct{font-size:11px;color:var(--dim)}#boss .bar{height:12px;border:1px solid #803030;background:#1a0c0c;margin-top:4px}#boss .bar div{height:100%;background:linear-gradient(90deg,#801818,#e04848)}
#toasts{position:absolute;left:50%;top:84px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:720px}
.toast{background:rgba(10,8,6,.85);border:1px solid var(--bd2);border-radius:4px;padding:5px 12px;font-size:13px;text-align:center;animation:fi .2s}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}}
#chan{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);font-size:12px;color:var(--gold);text-shadow:0 1px 2px #000}
#wind{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);font-size:16px;color:#c48cff;font-weight:700;text-shadow:0 1px 3px #000}
#buffs{position:absolute;left:14px;top:62px;display:flex;gap:4px;flex-wrap:wrap;width:320px}
.bf{font-size:11px;background:rgba(0,0,0,.6);border:1px solid var(--bd2);border-radius:3px;padding:1px 5px}
#keys{position:absolute;left:14px;top:100px;color:#8a7f66;font-size:11px;line-height:1.5;text-shadow:0 1px 2px #000}
/* panelek */
.panel{position:fixed;background:var(--pan);border:1px solid var(--bd);border-radius:6px;box-shadow:0 10px 40px #000c;display:none;z-index:10}
.panel .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd2)}
.panel .hd .h{font-size:17px}.panel .bd{padding:10px 12px;overflow:auto;max-height:calc(100vh - 140px)}
.x{background:none;border:none;font-size:18px;color:var(--dim);padding:0 4px}
#pInv{right:14px;top:50px;width:470px}#pChar{left:14px;top:50px;width:380px}#pSkill{left:50%;top:40px;transform:translateX(-50%);width:820px}#pQuest{left:14px;top:50px;width:440px}
#pDlg{left:50%;top:50%;transform:translate(-50%,-50%);width:640px}#pMenu{left:50%;top:50%;transform:translate(-50%,-50%);width:440px}#pMap{left:50%;top:50%;transform:translate(-50%,-50%)}
#pShop{left:14px;top:50px;width:520px}
.grid{display:grid;grid-template-columns:repeat(8,52px);gap:4px}
.cell{width:52px;height:52px;border:1px solid var(--bd2);border-radius:4px;background:#14110d;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;cursor:pointer}
.cell:hover{border-color:var(--gold)}.cell .u{position:absolute;right:2px;bottom:0;font-size:10px;color:#fff}.cell .rq{position:absolute;left:2px;top:0;font-size:9px;color:#ff7a7a}
.eqg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.eqs{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--dim);gap:2px}
#tt{position:fixed;z-index:50;background:rgba(10,8,6,.97);border:1px solid var(--bd);border-radius:5px;padding:8px 10px;max-width:320px;pointer-events:none;display:none;font-size:12px}
#tt .tt-n{font-weight:700;font-size:14px}#tt .tt-s{color:var(--dim);font-size:11px;margin-bottom:4px}#tt .tt-b{font-weight:700}#tt .tt-g{color:var(--dim)}#tt .tt-a{color:#8fb8ff}#tt .tt-r{color:#e8a8ff;margin-top:4px}#tt .tt-req{margin-top:4px;color:var(--dim)}#tt .tt-v{color:#ffd34d;font-size:11px}
.up{color:var(--ok)}.down{color:#ff7a7a}.upg{color:#ffd34d}
.row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #2a241b}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}.tabs button.on{border-color:var(--gold);color:#fff;background:linear-gradient(#5a4320,#2e2212)}
.sktree{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skc.ut{border-color:#8a6a2a;background:#1c160c}.ar{color:#ff9a7a}.skc{border:1px solid var(--bd2);border-radius:5px;padding:8px;background:#14110d}.skc.lk{opacity:.5}.skc .t{display:flex;gap:8px;align-items:center}.skc .ic{font-size:24px}.skc .nm{font-weight:700}.skc .d{font-size:11px;color:var(--dim);margin:4px 0}
.dlg-txt{font-size:14px;line-height:1.55;margin:6px 0 12px;min-height:44px}.dlg-opts{display:flex;flex-direction:column;gap:5px}.dlg-opts button{text-align:left}
.port{width:56px;height:56px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:28px}
/* menü */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1424 0%,#07060a 70%);z-index:20}
#menu .box{width:760px;max-width:96vw;text-align:center}
#menu .title{font-size:64px;margin:0;text-shadow:0 0 30px #c48cff88}#menu .sub{color:var(--dim);margin-bottom:24px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.slot{border:1px solid var(--bd);border-radius:6px;padding:12px;background:rgba(16,14,12,.8);cursor:pointer;min-height:110px}.slot:hover{border-color:var(--gold)}
.clsg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0;text-align:left}
.cls{border:1px solid var(--bd2);border-radius:6px;padding:10px;background:rgba(16,14,12,.85);cursor:pointer;font-size:12px}.cls.on{border-color:var(--gold);box-shadow:0 0 12px #e6c47a55}.cls .i{font-size:30px}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:30;flex-direction:column;text-align:center}
.mbtn{min-width:52px}
.mat{display:inline-flex;align-items:center;gap:3px;margin:2px 6px 2px 0;font-size:12px}.mat i{width:9px;height:9px;display:inline-block;transform:rotate(45deg)}
.small{font-size:11px;color:var(--dim)}
.morse{font-size:30px;letter-spacing:6px;font-family:monospace;color:#4dffb0;text-align:center;margin:10px 0}
.hgrid{display:grid;gap:1px;background:#222;margin:auto}.hc{width:30px;height:30px;background:#2c2a24;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}.hc:hover{outline:1px solid var(--gold)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="topl"><div id="rname" class="h"></div><div id="rsub"></div></div>
  <div id="buffs"></div>
  <div id="keys"></div>
  <canvas id="mm" width="190" height="190"></canvas>
  <div id="gold"></div>
  <div id="track"></div>
  <div id="boss"><div class="nm h"></div><div class="ct"></div><div class="bar"><div></div></div></div>
  <div id="toasts"></div>
  <div id="chan"></div><div id="wind"></div>
  <div id="surv"></div>
  <div id="bars">
    <div class="orb" id="ohp"><div class="f" style="background:linear-gradient(#ff4a4a,#7a0c0c)"></div><div class="t"></div></div>
    <div id="mid"><div id="stab"><div></div></div><div id="skillbar"></div><div id="xp"><div></div></div></div>
    <div class="orb" id="omp"><div class="f"></div><div class="t"></div></div>
  </div>
  <div id="quick" class="int"></div>
</div>
<div id="pInv" class="panel"></div><div id="pChar" class="panel"></div><div id="pSkill" class="panel"></div><div id="pQuest" class="panel"></div>
<div id="pDlg" class="panel"></div><div id="pMenu" class="panel"></div><div id="pMap" class="panel"></div><div id="pShop" class="panel"></div>
<div id="tt"></div>
<div id="menu"></div>
<div id="over"></div>
<script type="module">
'use strict';
// ============================================================
//  KAPUK – Multiverzum RPG · alapok (segédfüggvények, bemenet, hang)
// ============================================================
const VERZIO = '1.0';
const TILE = 32;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'e' : Math.round(n).toString();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function makeRng(seed) {
  let s = (seed >>> 0) || 0x9E3779B9;
  const f = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  f.int = (a, b) => a + Math.floor(f() * (b - a + 1));
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.chance = p => f() < p;
  f.range = (a, b) => a + f() * (b - a);
  return f;
}
let RNG = makeRng(Date.now() ^ 0x5bd1e995);
function weightedPick(list, rng = RNG, key = 'w') { let t = 0; for (const it of list) t += it[key]; let r = rng() * t; for (const it of list) { r -= it[key]; if (r <= 0) return it; } return list[list.length - 1]; }

// ---------------- bemenet ----------------
const Input = {
  keys: new Set(), pressed: new Set(), mx: 0, my: 0, mdown: [false, false, false], mclick: [false, false, false],
  wx: 0, wy: 0,
  init(canvas) {
    addEventListener('keydown', e => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (!this.keys.has(k)) this.pressed.add(k);
      this.keys.add(k);
      if ([' ', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
    });
    addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; this.keys.delete(k); });
    addEventListener('blur', () => { this.keys.clear(); this.mdown = [false, false, false]; });
    canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); this.mx = (e.clientX - r.left) * (canvas.width / r.width); this.my = (e.clientY - r.top) * (canvas.height / r.height); });
    canvas.addEventListener('mousedown', e => { this.mdown[e.button] = true; this.mclick[e.button] = true; Audio2.unlock(); });
    addEventListener('mouseup', e => { this.mdown[e.button] = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
  },
  hit(k) { return this.pressed.has(k); },
  endFrame() { this.pressed.clear(); this.mclick = [false, false, false]; }
};

// ---------------- hang (szintetizált) ----------------
const Audio2 = {
  ctx: null, master: null, vol: 0.5, muted: false, last: {},
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : this.vol; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  setVol(v) { this.vol = v; if (this.master) this.master.gain.value = this.muted ? 0 : v; },
  tone(f, dur, type = 'square', g = 0.15, slide = 0, delay = 0) {
    if (!this.ctx) return; const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), gn = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + dur);
    gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noiseHit(dur, g = 0.2, freq = 1200, q = 1, delay = 0) {
    if (!this.ctx) return; const t = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const gn = this.ctx.createGain(); gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(gn); gn.connect(this.master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  play(name) {
    if (!this.ctx || this.muted) return;
    const now = performance.now(); if (this.last[name] && now - this.last[name] < 45) return; this.last[name] = now;
    switch (name) {
      case 'swing': this.noiseHit(0.12, 0.12, 2500, 0.8); break;
      case 'hit': this.noiseHit(0.08, 0.18, 900, 1.5); this.tone(140, 0.08, 'square', 0.05, -60); break;
      case 'heavy': this.noiseHit(0.16, 0.3, 380, 0.7); this.tone(70, 0.18, 'sine', 0.22, -30); break;
      case 'crit': this.noiseHit(0.06, 0.2, 2600, 2); this.tone(1200, 0.07, 'triangle', 0.06, -500); break;
      case 'perfect': this.tone(1568, 0.25, 'sine', 0.08, -800); this.tone(784, 0.3, 'triangle', 0.06, 0, 0.04); break;
      case 'stamina': this.tone(220, 0.12, 'triangle', 0.06, -60); break;
      case 'shoot': this.noiseHit(0.07, 0.15, 3000, 0.7); this.tone(600, 0.06, 'square', 0.04, -400); break;
      case 'rifle': this.noiseHit(0.18, 0.25, 1500, 0.5); this.tone(220, 0.12, 'sawtooth', 0.06, -150); break;
      case 'magic': this.tone(520, 0.18, 'sine', 0.1, 400); this.tone(780, 0.14, 'triangle', 0.05, 300, 0.03); break;
      case 'fire': this.noiseHit(0.3, 0.18, 600, 0.6); this.tone(180, 0.25, 'sawtooth', 0.05, -80); break;
      case 'ice': this.tone(1400, 0.2, 'triangle', 0.07, -600); this.noiseHit(0.15, 0.08, 5000, 2); break;
      case 'zap': for (let i = 0; i < 3; i++) this.tone(900 + Math.random() * 900, 0.05, 'square', 0.05, -500, i * 0.03); break;
      case 'boom': this.noiseHit(0.6, 0.4, 300, 0.4); this.tone(80, 0.5, 'sine', 0.3, -50); break;
      case 'pickup': this.tone(880, 0.08, 'triangle', 0.08); this.tone(1320, 0.1, 'triangle', 0.07, 0, 0.06); break;
      case 'gold': this.tone(1600, 0.06, 'triangle', 0.05); this.tone(2100, 0.08, 'triangle', 0.04, 0, 0.04); break;
      case 'legend': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.35, 'triangle', 0.08, 0, i * 0.09)); break;
      case 'level': [392, 494, 587, 784, 988].forEach((f, i) => this.tone(f, 0.3, 'square', 0.06, 0, i * 0.08)); break;
      case 'hurt': this.tone(200, 0.15, 'sawtooth', 0.12, -120); break;
      case 'die': this.tone(300, 0.9, 'sawtooth', 0.15, -260); break;
      case 'ui': this.tone(660, 0.05, 'square', 0.04); break;
      case 'door': this.tone(110, 0.4, 'sawtooth', 0.08, 60); this.noiseHit(0.3, 0.1, 400); break;
      case 'portal': this.tone(200, 0.8, 'sine', 0.12, 600); this.tone(300, 0.8, 'sine', 0.08, 900, 0.1); break;
      case 'dash': this.noiseHit(0.15, 0.12, 1800, 0.5); break;
      case 'potion': this.tone(400, 0.2, 'sine', 0.1, 500); this.tone(600, 0.2, 'sine', 0.06, 500, 0.08); break;
      case 'burp': { // Kurta tisztelgése – mély, rezgő hang
        if (!this.ctx) break; const t = this.ctx.currentTime; const o = this.ctx.createOscillator(), g = this.ctx.createGain(), lfo = this.ctx.createOscillator(), lg = this.ctx.createGain();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(95, t); o.frequency.linearRampToValueAtTime(62, t + 0.7);
        lfo.frequency.value = 23; lg.gain.value = 30; lfo.connect(lg); lg.connect(o.frequency);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
        const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
        o.connect(f); f.connect(g); g.connect(this.master); o.start(t); lfo.start(t); o.stop(t + 0.85); lfo.stop(t + 0.85); break;
      }
      case 'morse': this.tone(700, 0.08, 'sine', 0.08); break;
      case 'bossroar': this.tone(70, 1.2, 'sawtooth', 0.2, 40); this.noiseHit(1.0, 0.2, 250, 0.5); break;
    }
  }
};

// ============================================================

    if (o.noReact || amt <= 0) return amt;
    const P = G.P, st = P.st, boost = 1 + (st.reakcio || 0) / 100;
    let hit = null;
    if (dt === 'tuz' && e.freeze > 0) { // Hősokk: a fagyott célpont szétpattan a hőtől

// ---------------- Erőforrás-állapotok (kasztonként) ----------------
const ResState = {
  // Düh-küszöbök: 50 fölött Felbőszült, teli dühnél a következő képesség ingyenes és erősebb
  tick(P, dt) {
    const S = G.S, C = CLASSES[S.cls], st = P.st;
    if (C.rage) {
      const tier = P.mp >= P.mmp - 0.5 ? 2 : P.mp >= 50 ? 1 : 0;
      if (tier !== P.rageTier) {
        if (tier >= 1 && !(P.rageTier >= 1)) G.buff(P, 'felboszult', 9999, { aspd: 12, msp: 6 });
        if (tier === 0) { P.buffs = P.buffs.filter(b => b.id !== 'felboszult'); recalc(P); }
        if (tier === 2) { G.text(P.x, P.y - 36, 'TOMBOLÓ', '#ff4433', 13); G.fxRing(P.x, P.y, 40, '#ff4433', 0.4, 3); }
        P.rageTier = tier;
      }
    }
    // Mana-túltöltés: teli manánál a töltődés egy túltöltő tartályba folyik (max. 30%)
    if (S.cls === 'elem') {
      if (P.mp >= P.mmp - 0.01) P.over = Math.min(P.mmp * 0.3, (P.over || 0) + st.mregen * dt * 0.6);
      else if (P.over > 0) P.over = Math.max(0, P.over - P.mmp * 0.02 * dt);
    }
    if (P.empowerT > 0) P.empowerT -= dt;
    if (P.gerillaT > 0) P.gerillaT -= dt;
  },
  // képesség használata előtt: költség módosítása és erősítés
  beforeCast(P, sk, cost) {
    const S = G.S, C = CLASSES[S.cls];
    if (C.rage && P.rageTier === 2 && !sk.spendAll && !FORBIDDEN[sk.id]) { P.empowerT = 0.8; P.empowerMul = 1.3; G.text(P.x, P.y - 40, 'ingyenes!', '#ff7a5a', 12); return 0; }
    if (S.cls === 'elem' && P.over > 0 && cost > 0) { const use = Math.min(P.over, cost); P.over -= use; P.empowerT = 0.8; P.empowerMul = 1.25; if (use >= cost * 0.99) G.text(P.x, P.y - 40, 'túltöltve', '#9fc8ff', 11); return cost - use; }
    return cost;
  },
};

// ---------------- Fókusz (Mesterlövész) ----------------
const Focus = {
  max(P) { return 5 + (P.st.turelem || 0); },
  onHit(P, e) {

    else { P.focus = P.st.gerilla ? Math.floor((P.focus || 0) / 2) + 1 : 1; P.focusE = e; }

  tick(P, dt) { if (P.focus > 0) { P.focusT -= dt; if (P.focusT <= 0) { P.focus = 0; P.focusE = null; } } },
  spend(P) { const f = P.focus || 0; P.focus = 0; return f; },

// ---------------- Gép-hálózat (Mérnök) ----------------
const Machines = {
  isM: a => a.kind === 'dron' || a.kind === 'torony',
  // a közeli gépek összekapcsolódnak: kapcsolatonként +8% gépsebzés (max. 4)
  links(a) { let n = 0; for (const b of G.allies) if (b !== a && b.life > 0 && this.isM(b) && b.owner === a.owner && dist2(a.x, a.y, b.x, b.y) < 260 * 260) n++; return Math.min(4, n); },
  mul(a) { const P = G.P; return 1 + 0.08 * (a.links || 0) * (1 + 0.5 * (P.st.gepesz || 0)); },
  // a torony megjelöli a célpontját; a drónok és rakéták azt választják
  target(x, y, range) { let best = null, bd = range * range; for (const e of G.enemies) { if (e.dead || e.invisNow || !(e.tmark > 0)) continue; const d = dist2(x, y, e.x, e.y); if (d < bd && los(G.map, x, y, e.x, e.y)) { bd = d; best = e; } } return best || G.nearestEnemy(x, y, range); },
  expire(a) { const P = G.P; if (a.grey || a.refunded || !this.isM(a) || a.owner !== P) return; a.refunded = true; P.mp = Math.min(P.mmp, P.mp + (a.kind === 'dron' ? 22 : 26) * 0.25); },

// ============================================================
//  TÉRKÉP: generálás, ütközés, statikus réteg, minitérkép
// ============================================================
const T_WALL = 0, T_FLOOR = 1, T_HAZ = 2, T_OBST = 3;

function makeMapObj(W, H) {
  return { w: W, h: H, t: new Uint8Array(W * H), shade: new Uint8Array(W * H), seen: new Uint8Array(W * H), rooms: [], objs: [], spawns: [], lights: [] };
}
const mIdx = (m, x, y) => y * m.w + x;
function tileAt(m, x, y) { if (x < 0 || y < 0 || x >= m.w || y >= m.h) return T_WALL; return m.t[y * m.w + x]; }
function solidTile(m, x, y) { const t = tileAt(m, x, y); return t === T_WALL || t === T_OBST; }
function solidAt(m, px, py) { return solidTile(m, Math.floor(px / TILE), Math.floor(py / TILE)); }

// Kör–rács ütközés feloldása (tengelyenként)
function moveCircle(m, e, dx, dy) {
  const r = e.r;
  const tryAxis = (nx, ny) => {
    const x0 = Math.floor((nx - r) / TILE), x1 = Math.floor((nx + r) / TILE), y0 = Math.floor((ny - r) / TILE), y1 = Math.floor((ny + r) / TILE);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      if (!solidTile(m, tx, ty)) continue;
      const cx = clamp(nx, tx * TILE, tx * TILE + TILE), cy = clamp(ny, ty * TILE, ty * TILE + TILE);
      if ((nx - cx) * (nx - cx) + (ny - cy) * (ny - cy) < r * r) return false;
    }
    return true;
  };
  let hit = false;
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / (r * 0.8)));
  const sx = dx / steps, sy = dy / steps;
  for (let i = 0; i < steps; i++) {
    if (sx) { if (tryAxis(e.x + sx, e.y)) e.x += sx; else hit = true; }
    if (sy) { if (tryAxis(e.x, e.y + sy)) e.y += sy; else hit = true; }
  }

}
// Látóvonal (DDA)
function los(m, ax, ay, bx, by) {
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / (TILE * 0.45));
  for (let i = 1; i < n; i++) { const x = ax + (bx - ax) * i / n, y = ay + (by - ay) * i / n; if (solidAt(m, x, y)) return false; }
  return true;

// BFS távolságmező (az ellenfelek útkeresése)
function flowField(m, sx, sy, maxD = 60) {
  const W = m.w, N = W * m.h;

  const f = m.field, q = m.q; f.fill(-1);
  const s = sy * W + sx; if (s < 0 || s >= N) return;
  let h = 0, tl = 0; q[tl++] = s; f[s] = 0;
  while (h < tl) {
    const c = q[h++], d = f[c]; if (d >= maxD) continue;
    const cx = c % W, cy = (c / W) | 0;
    if (cx > 0) { const n = c - 1; if (f[n] < 0 && walkTile(m, cx - 1, cy)) { f[n] = d + 1; q[tl++] = n; } }
    if (cx < W - 1) { const n = c + 1; if (f[n] < 0 && walkTile(m, cx + 1, cy)) { f[n] = d + 1; q[tl++] = n; } }
    if (cy > 0) { const n = c - W; if (f[n] < 0 && walkTile(m, cx, cy - 1)) { f[n] = d + 1; q[tl++] = n; } }
    if (cy < m.h - 1) { const n = c + W; if (f[n] < 0 && walkTile(m, cx, cy + 1)) { f[n] = d + 1; q[tl++] = n; } }
  }
}
function flowDir(m, x, y) {
  const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE), f = m.field; if (!f) return null;
  const c = f[ty * m.w + tx]; if (c < 0) return null;

  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
    if (!ox && !oy) continue; const nx = tx + ox, ny = ty + oy;
    if (nx < 0 || ny < 0 || nx >= m.w || ny >= m.h) continue;
    const v = f[ny * m.w + nx]; if (v < 0) continue;
    if (ox && oy && (!walkTile(m, tx + ox, ty) || !walkTile(m, tx, ty + oy))) continue; // ne vágjon sarkot
    if (v < best) { best = v; bx = ox; by = oy; }
  }
  if (!bx && !by) return null;
  const gx = (tx + bx + 0.5) * TILE, gy = (ty + by + 0.5) * TILE;

// ---------------- kazamata-generátor ----------------
function genDungeon(seed, region, floorNo, opts = {}) {
  const rng = makeRng(seed);
  const W = opts.w || 76, H = opts.h || 76;
  const m = makeMapObj(W, H);
  m.region = region.id; m.floor = floorNo; m.seed = seed; m.style = region.style;
  const rooms = m.rooms;
  if (opts.boss) { const bw = 26, bh = 22; rooms.push({ x: W - bw - 4, y: H - bh - 4, w: bw, h: bh, boss: true }); }
  const want = opts.rooms || rng.int(10, 14);
  for (let i = 0; i < 500 && rooms.length < want; i++) {
    const w = rng.int(7, 15), h = rng.int(7, 13);
    const x = rng.int(2, W - w - 3), y = rng.int(2, H - h - 3);
    if (rooms.some(r => x < r.x + r.w + 3 && x + w + 3 > r.x && y < r.y + r.h + 3 && y + h + 3 > r.y)) continue;
    rooms.push({ x, y, w, h });
  }
  rooms.forEach(r => { r.cx = r.x + (r.w >> 1); r.cy = r.y + (r.h >> 1); for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) m.t[y * W + x] = T_FLOOR; });
  // Prim-féle feszítőfa + néhány extra él
  const conn = [0], edges = [];
  const left = new Set(rooms.map((_, i) => i)); left.delete(0);
  while (left.size) {
    let best = null, bd = 1e9;
    for (const a of conn) for (const b of left) { const d = Math.abs(rooms[a].cx - rooms[b].cx) + Math.abs(rooms[a].cy - rooms[b].cy); if (d < bd) { bd = d; best = [a, b]; } }
    edges.push(best); conn.push(best[1]); left.delete(best[1]);
  }
  for (let i = 0; i < 3; i++) { const a = rng.int(0, rooms.length - 1), b = rng.int(0, rooms.length - 1); if (a !== b && !(opts.boss && (rooms[a].boss || rooms[b].boss))) edges.push([a, b]); }
  const carve = (x, y) => { if (x > 0 && y > 0 && x < W - 1 && y < H - 1 && m.t[y * W + x] === T_WALL) m.t[y * W + x] = T_FLOOR; };
  for (const [a, b] of edges) {
    const A = rooms[a], B = rooms[b], wd = rng.int(2, 3);
    const horizFirst = rng() < 0.5;
    const hx = (y, x0, x1) => { for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) for (let k = 0; k < wd; k++) carve(x, y + k); };
    const vy = (x, y0, y1) => { for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) for (let k = 0; k < wd; k++) carve(x + k, y); };
    if (horizFirst) { hx(A.cy, A.cx, B.cx); vy(B.cx, A.cy, B.cy); } else { vy(A.cx, A.cy, B.cy); hx(B.cy, A.cx, B.cx); }
  }
  // kezdő terem: a bossteremtől legtávolabbi (vagy a 0. ha nincs boss)
  const bfsFrom = (x, y) => { flowField(m, x, y, 9999); return m.field; };
  let startI;
  if (opts.boss) {
    const f = bfsFrom(rooms[0].cx, rooms[0].cy); let bd = -1; startI = 1;
    rooms.forEach((r, i) => { if (i === 0) return; const d = f[r.cy * W + r.cx]; if (d > bd) { bd = d; startI = i; } });
  } else startI = rng.int(0, rooms.length - 1);
  const S = rooms[startI]; S.start = true;
  const f = bfsFrom(S.cx, S.cy);
  let exitI = 0, ed = -1;
  rooms.forEach((r, i) => { const d = f[r.cy * W + r.cx]; r.dist = d; if (!opts.boss && i !== startI && d > ed) { ed = d; exitI = i; } });
  if (opts.boss) exitI = 0;
  rooms[exitI].exit = true;
  m.start = { x: (S.cx + 0.5) * TILE, y: (S.cy + 0.5) * TILE };
  m.exitRoom = rooms[exitI];

  // akadályok – a terem 2 csempés szegélye mindig szabad marad, így az összeköttetés nem sérül
  rooms.forEach(r => {
    if (r.start) return;
    const ix0 = r.x + 2, iy0 = r.y + 2, ix1 = r.x + r.w - 3, iy1 = r.y + r.h - 3;
    if (ix1 - ix0 < 2 || iy1 - iy0 < 2) return;
    const st = r.boss ? 'pillars' : region.style;
    const put = (x, y) => { if (x >= ix0 && x <= ix1 && y >= iy0 && y <= iy1 && m.t[y * W + x] === T_FLOOR) m.t[y * W + x] = T_OBST; };

      else { for (let y = iy0; y <= iy1; y += 3) { const gap = rng.int(ix0 + 1, ix1 - 1); for (let x = ix0; x <= ix1; x++) if (Math.abs(x - gap) > 0) put(x, y); } }
    } else if (st === 'pillars') {
      for (let y = iy0 + 1; y < iy1; y += 4) for (let x = ix0 + 1; x < ix1; x += 4) if (rng() < (r.boss ? 0.5 : 0.7)) { put(x, y); if (!r.boss) { put(x + 1, y); put(x, y + 1); put(x + 1, y + 1); } }
    } else {
      const dens = st === 'rocks' ? 0.07 : 0.045;
      for (let y = iy0; y <= iy1; y++) for (let x = ix0; x <= ix1; x++) if (rng() < dens) { put(x, y); if (rng() < 0.4) put(x + 1, y); }
    }
    // veszélyes talaj
    if (region.haz && !r.boss && rng() < 0.75) {
      const n = rng.int(1, 3);
      for (let k = 0; k < n; k++) {
        const hx = rng.int(r.x + 1, r.x + r.w - 2), hy = rng.int(r.y + 1, r.y + r.h - 2), rad = rng.range(1.3, 3.2);

      }
    }
  });
  for (let i = 0; i < W * H; i++) m.shade[i] = Math.floor(rng() * 255);
  return m;
}

// véletlen szabad pont egy teremben
function roomSpot(m, r, rng, margin = 1) {
  for (let i = 0; i < 40; i++) {
    const x = rng.int(r.x + margin, r.x + r.w - 1 - margin), y = rng.int(r.y + margin, r.y + r.h - 1 - margin);
    if (tileAt(m, x, y) === T_FLOOR) return { x: (x + 0.5) * TILE, y: (y + 0.5) * TILE };
  }
  return { x: (r.cx + 0.5) * TILE, y: (r.cy + 0.5) * TILE };
}

// ---------------- Kapuváros (kézzel tervezett központ) ----------------
function genTown() {
  const W = 60, H = 50, m = makeMapObj(W, H); m.region = 'varos'; m.floor = 0; m.style = 'town';
  const rect = (x, y, w, h, v) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) m.t[j * W + i] = v; };
  rect(3, 3, W - 6, H - 6, T_FLOOR);
  // épületek (akadályként), előttük az NPC
  const houses = [[6, 6, 8, 5], [18, 5, 7, 5], [36, 5, 7, 5], [47, 6, 8, 5], [6, 38, 8, 6], [47, 38, 8, 6], [18, 40, 6, 5], [37, 40, 6, 5]];
  houses.forEach(h => rect(h[0], h[1], h[2], h[3], T_OBST));
  // szökőkút-gyűrű a Kapu körül
  for (let a = 0; a < 24; a++) { const x = Math.round(30 + Math.cos(a / 24 * 6.283) * 6), y = Math.round(25 + Math.sin(a / 24 * 6.283) * 5); if (a % 6 !== 0) m.t[y * W + x] = T_OBST; }
  // fák
  const rng = makeRng(77);
  for (let i = 0; i < 40; i++) { const x = rng.int(4, W - 5), y = rng.int(13, 36); if ((x - 30) ** 2 + (y - 25) ** 2 > 110 && Math.abs(x - 30) > 3 && m.t[y * W + x] === T_FLOOR && rng() < 0.5) m.t[y * W + x] = T_OBST; }
  for (let i = 0; i < W * H; i++) m.shade[i] = Math.floor(rng() * 255);
  m.start = { x: 30.5 * TILE, y: 32 * TILE };
  m.houses = houses;
  return m;
}

// ---------------- statikus réteg kirajzolása ----------------
function renderStatic(m, pal) {

    const t = m.t[y * m.w + x]; if (t !== T_WALL) continue;

// ============================================================
//  TÁRGYAK: generálás, nevek, ár, leírás, kovácsolás
// ============================================================
let ITEM_UID = 1;
const WEAPON_KEYS = Object.keys(BASES).filter(k => BASES[k].slot === 'fegyver');
const ARMOR_KEYS = Object.keys(BASES).filter(k => BASES[k].slot !== 'fegyver');

function rollRarity(rng, mf = 0, floor = 0) {
  const r = rng() / (1 + mf / 100);
  let rar = r < 0.012 ? 3 : r < 0.09 ? 2 : r < 0.36 ? 1 : 0;
  return Math.max(rar, floor);
}
function pickBase(rng, ilvl, cls) {
  const isW = rng() < 0.36;
  let pool = (isW ? WEAPON_KEYS : ARMOR_KEYS).filter(k => (BASES[k].reqLvl || 0) <= ilvl + 2);
  if (isW && cls && rng() < 0.45) { // kicsit gyakrabban a kasztnak megfelelő fegyver
    const pref = { penge: ['kard', 'poroly', 'lancfuresz'], elem: ['palca', 'bot'], loves: ['puska', 'pisztoly', 'serettel'], mernok: ['pisztoly', 'raketaveto', 'plazmavezeto'] }[cls];
    const p2 = pool.filter(k => pref.includes(k)); if (p2.length) pool = p2;
  }
  let b = rng.pick(pool);
  if (BASES[b].slot === 'artefakt' && cls && rng() < 0.75) b = ARTI_FOR[cls];
  return b;
}
function genItem(ilvl, rng = RNG, o = {}) {
  ilvl = Math.max(1, Math.round(ilvl));
  let relic = null;
  if (o.relic) relic = RELICS.find(r => r.id === o.relic);
  const rar = relic ? 4 : (o.rar != null ? o.rar : rollRarity(rng, o.mf || 0, o.minRar || 0));
  const base = relic ? relic.base : (o.base || pickBase(rng, ilvl, o.cls));
  const B = BASES[base];
  const it = { uid: ITEM_UID++, base, ilvl, rar, upg: 0, aff: [], seed: Math.floor(rng() * 1e9) };
  const q = 0.85 + rng() * 0.3; // minőség
  if (B.slot === 'fegyver') { it.min = Math.max(1, Math.round(B.min * wepScale(ilvl) * q)); it.max = Math.max(it.min + 1, Math.round(B.max * wepScale(ilvl) * q)); }
  if (B.arm) it.arm = Math.round(B.arm * armScale(ilvl) * q);
  if (relic) {
    it.relic = relic.id;
    relic.aff.forEach(([id, mul]) => { const A = AFFIX.find(a => a.id === id); it.aff.push({ id, v: Math.round(A.v(ilvl, rng) * mul * 10) / 10 }); });
    it.nev = relic.nev;
  } else {
    const [a0, a1] = RARITY[rar].aff; const n = a0 + Math.floor(rng() * (a1 - a0 + 1));
    const pool = AFFIX.filter(a => (!a.slots || a.slots.includes(B.slot)) && (a.minL || 0) <= ilvl);
    const used = new Set();
    for (let i = 0; i < n && pool.length; i++) {
      let A; let tries = 0;
      do { A = rng.pick(pool); tries++; } while ((used.has(A.id) || (A.rare && rng() < 0.7)) && tries < 20);
      if (used.has(A.id)) continue; used.add(A.id);
      let v = A.v(ilvl, rng); if (rar === 3) v = Math.round(v * 1.35 * 10) / 10;
      it.aff.push({ id: A.id, v });
    }
    it.nev = itemName(it, rng);
  }
  it.req = Math.max(1, Math.floor(ilvl * 0.8));
  return it;
}
function itemName(it, rng) {
  const tier = Math.min(4, Math.floor((it.ilvl - 1) / 14));
  const bn = BASE_NAMES[it.base][tier];
  if (it.rar === 0) return bn;
  const pre = it.aff.length ? AFFIX.find(a => a.id === it.aff[0].id).pre : '';
  if (it.rar === 3) {
    const leg = ['a Kapuőr', 'Bodor öröksége', 'a Csillagméhes', 'a Gutenberg-határ', '1957', 'a 976. tárhely', 'a Holdkomp', 'Novikov', 'a Fotongyűrű', 'a Kárpátok', 'Lehmann', 'a Bébi-univerzum', 'a Penrose-folyamat', 'Szélanyó', 'a Kola-fúrás', 'a Moho'];
    return `${bn} – ${rng.pick(leg)}`;
  }
  return pre ? `${pre} ${bn.charAt(0).toLowerCase() + bn.slice(1)}` : bn;
}
const upgMul = it => 1 + 0.1 * (it.upg || 0);
function itemDmg(it) { return [Math.round(it.min * upgMul(it)), Math.round(it.max * upgMul(it))]; }
function itemArm(it) { return Math.round((it.arm || 0) * upgMul(it)); }
function affVal(it, a) { return a.id === 'skill' ? a.v : Math.round(a.v * (1 + 0.05 * (it.upg || 0)) * 10) / 10; }
function itemValue(it) { return Math.round((8 + it.ilvl * 4) * [1, 2.2, 5, 12, 20][it.rar] * (1 + 0.15 * (it.upg || 0))); }
function salvageYield(it) { return Math.max(1, Math.round([1, 2, 5, 12, 20][it.rar] * (1 + it.ilvl / 15))); }
function upgradeCost(it) { const u = it.upg || 0; return { arany: Math.round((20 + it.ilvl * 6) * Math.pow(1.6, u)), szilank: Math.round((2 + it.ilvl / 6) * (u + 1)), esely: Math.max(0.35, 1 - u * 0.07) }; }

function itemTooltip(it, cmp) {
  const B = BASES[it.base], R = RARITY[it.rar];
  let h = `<div class="tt-n" style="color:${R.c}">${esc(it.nev)}${it.upg ? ` <span class="upg">+${it.upg}</span>` : ''}</div>`;
  h += `<div class="tt-s">${R.nev} ${B.nev.toLowerCase()} · tárgyszint ${it.ilvl}</div>`;
  if (B.slot === 'fegyver') {
    const [a, b] = itemDmg(it); h += `<div class="tt-b">${a}–${b} ${DT[B.dtype].nev.toLowerCase()} sebzés</div><div class="tt-g">${B.spd.toFixed(2)} támadás/mp · ${{ melee: 'közelharc', ranged: 'lőfegyver', spell: 'mágia' }[B.kind]}</div>`;
    if (cmp && cmp.min) { const d = ((a + b) / 2 * B.spd) - ((itemDmg(cmp)[0] + itemDmg(cmp)[1]) / 2 * BASES[cmp.base].spd); h += `<div class="${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(1)} sebzés/mp a viselthez képest</div>`; }
  }
  if (it.arm) { h += `<div class="tt-b">${itemArm(it)} páncél</div>`; if (cmp && cmp.arm != null) { const d = itemArm(it) - itemArm(cmp); if (d) h += `<div class="${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)} páncél</div>`; } }
  it.aff.forEach(a => { const A = AFFIX.find(x => x.id === a.id); h += `<div class="tt-a">${A.nev(affVal(it, a))}</div>`; });
  if (it.relic) { const RL = RELICS.find(r => r.id === it.relic); h += `<div class="tt-r">✦ ${esc(RL.txt)}</div>`; }
  const P = G.P;
  h += `<div class="tt-req ${P && P.lvl < it.req ? 'down' : ''}">Szükséges szint: ${it.req}</div>`;
  h += `<div class="tt-v">Érték: ${fmt(itemValue(it))} arany</div>`;
  return h;
}

function weaponRange(P) { const w = P.S.eq.fegyver; if (!w || w.req > P.S.lvl) return [1 + P.S.lvl, 3 + P.S.lvl * 2]; const [a, b] = itemDmg(w); return [a + P.st.flat, b + P.st.flat]; }

  const st = P.st;
  let bonus = st.dmg.all;
  if (kind === 'best') bonus += Math.max(st.dmg.melee, st.dmg.ranged, st.dmg.spell, st.dmg.summon);
  else bonus += st.dmg[kind] || 0;

  if (kind === 'spell' && w && BASES[w.base].kind !== 'spell') base *= 0.85; // varázslat nem varázsfegyverrel
  if (st.verszomj && CLASSES[P.S.cls].rage) bonus += Math.floor(P.mp / 10) * st.verszomj;

const SURV_RATE = { kaja: 100 / 1300, ital: 100 / 850, ebren: 100 / 2200 };
function survivalTick(P, dt, inTown) {
  const sv = P.S.surv; const mul = (inTown ? 0.4 : 1) / (1 + P.st.at.allo * 0.006);
  const before = [sv.kaja < 30, sv.ital < 30, sv.ebren < 30, sv.kaja <= 0, sv.ital <= 0, sv.ebren <= 0].join();
  sv.kaja = Math.max(0, sv.kaja - SURV_RATE.kaja * dt * mul * (P.combatT > 0 ? 1.3 : 1));
  sv.ital = Math.max(0, sv.ital - SURV_RATE.ital * dt * mul * (P.combatT > 0 ? 1.4 : 1) * (G.map && G.map.region === 'melyseg' ? 1.6 : 1));
  sv.ebren = Math.max(0, sv.ebren - SURV_RATE.ebren * dt * mul * (P.combatT > 0 ? 1.2 : 1));
  const after = [sv.kaja < 30, sv.ital < 30, sv.ebren < 30, sv.kaja <= 0, sv.ital <= 0, sv.ebren <= 0].join();
  if (before !== after) { recalc(P); if (sv.kaja < 30 && sv.kaja > 29) UI.toast('Megéheztél. Egyél valamit (H).', '#ffb36b'); if (sv.ital < 30 && sv.ital > 29) UI.toast('Szomjas vagy. Igyál (G).', '#7fd8ff'); if (sv.ebren < 30 && sv.ebren > 29) UI.toast('Fáradt vagy. Pihenj: sátor (N) vagy a kocsma.', '#c48cff'); }
  if (sv.kaja <= 0) G.hurtPlayer(P.mhp * 0.006 * dt, 'fiz', null, { pure: true, silent: true });
  if (sv.ital <= 0) G.hurtPlayer(P.mhp * 0.009 * dt, 'fiz', null, { pure: true, silent: true });
  if (sv.ebren <= 0) { P.sleepyT = (P.sleepyT || 0) + dt; if (P.sleepyT > 18) { P.sleepyT = 0; P.stun = Math.max(P.stun, 1.2); G.text(P.x, P.y - 30, 'Zzz…', '#c48cff', 14); } }
}
function eatFood(id) {
  const S = G.S, F = FOODS[id]; if (!F || !(S.food[id] > 0) || F.tent) return false;
  S.food[id]--; if (!S.food[id]) delete S.food[id];
  const sv = S.surv; if (F.kaja) sv.kaja = Math.min(100, sv.kaja + F.kaja); if (F.ital) sv.ital = Math.min(100, sv.ital + F.ital); if (F.alvas) sv.ebren = Math.min(100, sv.ebren + F.alvas);
  if (F.hp) G.P.hp = Math.min(G.P.mhp, G.P.hp + G.P.mhp * F.hp);
  if (id === 'kola' || id === 'bika') { G.P.gas = Math.min(100, (G.P.gas || 0) + (id === 'kola' ? 14 : 22)); }
  if (id === 'sprite') G.P.gas = Math.max(0, (G.P.gas || 0) - 25);

}
function autoEat(kind) { // H: étel, G: ital
  const S = G.S, k = kind === 'kaja' ? 'kaja' : 'ital';
  const opts = Object.keys(S.food).filter(id => FOODS[id][k] && S.food[id] > 0).sort((a, b) => (FOODS[b][k] || 0) - (FOODS[a][k] || 0));

  fxRing(x, y, r, c, life = 0.4, w = 3) { this.parts.push({ ring: true, x, y, r, c, t: 0, life, w }); },
  emit(ev, d) { if (typeof Quests !== 'undefined') Quests.on(ev, d); },
  mapIs(id) { return this.map && this.map.region === id; },

  // ---------- térbeli rács az ellenfelekhez ----------

  },
  near(x, y, r) {
    const out = [], x0 = ((x - r) / 96) | 0, x1 = ((x + r) / 96) | 0, y0 = ((y - r) / 96) | 0, y1 = ((y + r) / 96) | 0;
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) { const a = this.grid.get(gx + ',' + gy); if (a) for (const e of a) if (!e.dead && dist2(x, y, e.x, e.y) < (r + e.r) * (r + e.r)) out.push(e); }

    for (const o of m.objs) { const tx = Math.floor(o.x / TILE), ty = Math.floor(o.y / TILE); for (let y = ty - 1; y <= ty + 1; y++) for (let x = tx - 1; x <= tx + 1; x++) if (m.t[y * m.w + x] === T_OBST && !(m.houses.some(h => x >= h[0] && x < h[0] + h[2] && y >= h[1] && y < h[1] + h[3])) && Math.hypot(x - 30, y - 25) > 8) m.t[y * m.w + x] = T_FLOOR; }
    this.setMap(m, { void: '#0d1a10', floor: '#56704a', floor2: '#627d52', wall: '#3b4a3a', obst: '#7a3b2e', speck: '#a6c48a', light: '#fff3d0' });

  regionLvl(rid, floor) { const R = REGION[rid]; return R.lvl + (floor - 1) + this.diffLvl(); },

  enterHasadek(n, weekly) {

  // ---------- benépesítés ----------
  populate(m, R, boss, rng, hasadek) {
    const L = m.lvl, S = this.S;
    const packs = [];
    m.rooms.forEach(r => {
      if (r.start) return;
      if (r.boss) return;
      const area = r.w * r.h, n = Math.round(area / 30 * (0.8 + rng() * 0.5) * (1 + S.prog.diff * 0.15));
      const champ = rng() < 0.12, elite = !champ && rng() < 0.22;
      const types = R.enemies;
      const main = rng.pick(types), side = rng.pick(types);
      for (let i = 0; i < n; i++) {
        const p = roomSpot(m, r, rng);
        const t = i < n * 0.65 ? main : side;
        const o = {};
        if (champ && i === 0) { o.champion = true; o.mods = [rng.pick(Object.keys(ELITE_MODS)), rng.pick(Object.keys(ELITE_MODS))]; }
        else if (elite && i < 3) { o.elite = true; o.mods = [elite && i === 0 ? rng.pick(Object.keys(ELITE_MODS)) : (packs.lastMod || rng.pick(Object.keys(ELITE_MODS)))]; packs.lastMod = o.mods[0]; }
        this.spawnEnemy(t, p.x, p.y, L, o);
      }
      // ládák, hordók, szentélyek, gyűjtőhelyek
      if (rng() < 0.35) { const p = roomSpot(m, r, rng, 2); m.objs.push(this.makeChest(p.x, p.y, rng() < 0.15)); }
      const nb = rng.int(0, 3); for (let i = 0; i < nb; i++) { const p = roomSpot(m, r, rng, 1); m.objs.push({ type: 'barrel', x: p.x, y: p.y, r: 11, hp: 20 * monHp(L) * 0.3, boom: m.style === 'machine' || rng() < 0.12 }); }
      if (rng() < 0.08) { const p = roomSpot(m, r, rng, 2); m.objs.push(this.makeShrine(p.x, p.y, rng)); }
      if (rng() < 0.55) { const pool = REGION_NODES[hasadek ? 'hasadek' : m.region] || REGION_NODES.hasadek; const k = rng.pick(pool); const p = roomSpot(m, r, rng, 1); m.objs.push(this.makeNode(p.x, p.y, k)); }
      if (m.style === 'comb' && rng() < 0.3) { const p = roomSpot(m, r, rng, 2); m.objs.push({ type: 'hive', x: p.x, y: p.y, r: 16, hp: 60 * monHp(L) * 0.4, spawnT: 4 }); }
    });
    // kijárat
    const ex = m.exitRoom;
    if (!boss) { const p = { x: (ex.cx + 0.5) * TILE, y: (ex.cy + 0.5) * TILE }; m.objs.push(this.makeExit(p.x, p.y, R, hasadek)); }
    // boss
    if (boss) {
      const br = m.rooms.find(r => r.boss);
      const bid = hasadek ? R.boss : (R.id === 'eh' && this.S.prog.bosses.onmagad ? 'szingularitas' : R.boss);
      const D = BOSSES[bid];
      const e = this.spawnEnemy(bid, (br.cx + 0.5) * TILE, (br.cy + 0.5) * TILE, L + 2, { boss: true, bossDef: D, r: D.r });
      e.bossId = bid; this.boss = e; e.state = 'idle';
      if (D.chains) this.spawnChains(e, D.chains);
      if (D.antennas) this.spawnAntennas(e, D.antennas);
      if (hasadek) { e.mhp *= 1.2; e.hp = e.mhp; }
    }
    // Ős – a világ 2. vagy 3. szintjén kóborol (és a Hasadékban 7-esével)
    const A = ANCIENTS[m.region];
    if (!hasadek && A && !boss && m.floor === (A.floor || (m.floor >= 2 ? m.floor : 0))) {
      if (m.floor === 2 || m.floor === 3) {
        const r = m.rooms.filter(r => !r.start && !r.exit).sort((a, b) => b.w * b.h - a.w * a.h)[0];
        if (r && rng() < 0.75) { const p = roomSpot(m, r, rng, 2); const e = this.spawnEnemy(A.base, p.x, p.y, L + A.lvlPlus, { ancient: A, mods: A.mods }); e.r = A.r; }
      }
    }
    if (hasadek && m.hasadek % 7 === 0) { const keys = Object.keys(ANCIENTS); const A2 = ANCIENTS[keys[rng.int(0, keys.length - 1)]]; const r = m.rooms.find(r => !r.start); const p = roomSpot(m, r, rng, 2); this.spawnEnemy(A2.base, p.x, p.y, L + 20, { ancient: A2, mods: A2.mods }).r = A2.r; }
    // világ-mechanikák
    const mech = R.mech || (REGION[m.region] && REGION[m.region].mech);
    m.mech = mech;
    if (mech === 'eh') {
      m.exitW = rng.pick([-3, -2, -1, 1, 2, 3]);
      const jr = m.rooms.filter(r => !r.exit && !r.boss)[rng.int(0, Math.max(0, m.rooms.filter(r => !r.exit && !r.boss).length - 1))];
      if (jr && !boss) { const p = roomSpot(m, jr, rng, 2); m.objs.push({ type: 'jelado', x: p.x, y: p.y, r: 14, label: 'Jeladó', inter: () => UI.toast(`A jeladó ismétli: „A kijárat fázisfala W = ${m.exitW > 0 ? '+' : ''}${m.exitW} értéken nyílik.” (Z / X: W-eltolás)`, '#c48cff', 6) }); }
      m.secretW = rng() < 0.5 ? -4 : 4;
      const sr = m.rooms[rng.int(0, m.rooms.length - 1)]; if (sr && !sr.start) { const p = roomSpot(m, sr, rng, 2); m.objs.push({ type: 'buborek', x: p.x, y: p.y, r: 18, w: m.secretW, label: 'Bébi-univerzum', inter: (o) => this.openBuborek(o) }); }
    }
    if (mech === 'jeltoro' && !boss) {
      const ex = m.objs.find(o => o.type === 'exit'); if (ex) { ex.locked = 'radio'; const word = rng.pick(MORSE_WORDS); ex.word = word; m.objs.push({ type: 'radio', x: ex.x + 50, y: ex.y, r: 14, label: 'Rádióadó', word, inter: (o) => UI.morsePuzzle(o, ex) }); }
    }
    if (mech === 'raktar') { // r3 lore: aranyraklap
      if (rng() < 0.4) { const r = rng.pick(m.rooms.filter(r => !r.start)); const p = roomSpot(m, r, rng, 2); const c = this.makeChest(p.x, p.y, true); c.gold = true; c.label = 'Aranyraklap'; m.objs.push(c); }
    }
    Quests.populateHook(m, R, rng);
    m.objs.forEach(o => { if (o.hp) o.mhp = o.hp; });
  },
  makeChest(x, y, rich) { return { type: 'chest', x, y, r: 14, rich, label: rich ? 'Díszes láda' : 'Láda', inter: (o) => { if (o.open) return; o.open = true; o.inter = null; Audio2.play('door'); const n = o.gold ? 0 : rich ? 2 : 1; for (let i = 0; i < n; i++) this.spawnPickup(o.x, o.y, 'item', 0, genItem(this.map.lvl, RNG, { mf: this.P.st.mf, cls: this.S.cls, minRar: rich ? 1 : 0 })); this.spawnPickup(o.x, o.y, 'gold', Math.round((5 + this.map.lvl * 3) * (o.gold ? 12 : rich ? 3 : 1))); if (RNG() < 0.5) this.spawnPickup(o.x, o.y, 'food', RNG.pick(FOOD_DROPS[this.map.region] || FOOD_DROPS.hasadek)); if (RNG() < 0.4) this.spawnPickup(o.x, o.y, 'mat', RNG.pick(REGION_NODES[this.map.region] || REGION_NODES.hasadek)); this.emit('chest'); } }; },
  makeShrine(x, y, rng) {
    const kinds = [['Erő szentélye', { dmgp: 40 }, '#ff7a4a'], ['Vas szentélye', { armp: 80, resall: 25 }, '#c0c8d0'], ['Szél szentélye', { msp: 35, aspd: 25 }, '#9fe07a'], ['Szerencse szentélye', { mf: 100, gf: 100 }, '#ffd34d'], ['Idő szentélye', { cdr: 30, resgen: 60 }, '#c48cff']];

  },
  makeNode(x, y, k) {
    const N = NODES[k];
    return { type: 'node', kind: k, x, y, r: 14, label: N.nev, left: 2 + Math.floor(RNG() * 2), inter: (o) => this.startChannel(1.1, `${N.nev} gyűjtése…`, () => { const n = 1 + (RNG() < 0.35 ? 1 : 0) + (this.map.lvl > 20 && RNG() < 0.3 ? 1 : 0); this.S.mats[k] = (this.S.mats[k] || 0) + n; this.text(o.x, o.y - 16, `+${n} ${MATS[k].nev}`, MATS[k].c, 12); Audio2.play('pickup'); this.burst(o.x, o.y, MATS[k].c, 10, 90); o.left--; if (o.left <= 0) { o.dead = true; } this.emit('gather', k); }) };

  makeExit(x, y, R, hasadek) {

      if (m.mech === 'eh' && this.P.w !== m.exitW) { UI.toast(`A fázisfal zárva. Rossz W-n vagy (most: ${this.P.w > 0 ? '+' : ''}${this.P.w}). Keresd a jeladót.`, '#c48cff', 4); return; }
      if (o.locked === 'radio') { UI.toast('A lejáratot rádiós zár védi. Fejtsd meg az adót mellette.', '#4dffb0', 4); return; }

  makeReturnPortal() { const rp = this.retPortal; return { type: 'portal', x: 30.5 * TILE, y: 29.5 * TILE, r: 20, label: `Vissza: ${rp.label}`, c: '#6fa8ff', inter: () => this.useReturnPortal() }; },
  openBuborek(o) {

  // ---------- városi kapu ----------
  townPortal() {

  useReturnPortal() {

  },
  startChannel(t, label, fn, c = '#ffd34d') { const P = this.P; if (P.chan) return; P.chan = { t: 0, dur: t, label, fn, c, x: P.x, y: P.y }; },

  // ---------- sátor ----------
  pitchTent() {

  },

  // ---------- boss, Ős ----------
  bossDefeated(e) {

    this.enemies.forEach(x => { if (!x.dead && (x.parent || x.xp < 50) && dist(x, e) < 700) { x.xp = 0; this.killEnemy(x); } });
    if (m.hasadek) { S.prog.hasadek = Math.max(S.prog.hasadek, m.hasadek); m.objs.push({ type: 'exit', x: e.x, y: e.y + 80, r: 22, label: 'Tovább a Hasadékba', inter: () => { if (m.weekly) Univ.weeklyProgress(m.hasadek); this.enterHasadek(m.hasadek + 1, m.weekly); } }); m.objs.push({ type: 'portal', x: e.x - 70, y: e.y + 80, r: 20, label: 'Haza, Kapuvárosba', c: '#6fa8ff', inter: () => this.enterTown() }); return; }
    const R = REGION[m.rid]; const first = !S.prog.bosses[bid];
    S.prog.bosses[bid] = (S.prog.bosses[bid] || 0) + 1;
    if (first) {
      UI.toast(`${e.bossDef.nev} legyőzve!`, '#ffd34d', 5);

      const i = REGIONS.findIndex(r => r.id === m.rid); const nx = REGIONS[i + 1];
      if (nx && !S.prog.unlocked.includes(nx.id)) { S.prog.unlocked.push(nx.id); S.prog.wp[nx.id] = 1; UI.toast(`Új világ nyílt meg a Kapuban: ${nx.nev}`, '#9fe8ff', 6); }

  // ---------- JÁTÉKOS IRÁNYÍTÁS ----------
  updatePlayer(dt) {
    const P = this.P, S = this.S, m = this.map, st = P.st, C = CLASSES[S.cls];
    if (P.dead) return;
    // időzítők, buffok
    P.invul -= dt; P.potCd -= dt; P.dashCd -= dt; P.perfectT -= dt; P.staDelay -= dt; P.comboT -= dt; P.hurtT -= dt; P.wCd -= dt; P.combatT -= dt; P.magT -= dt; P.artiCd -= dt;
    for (const k in P.cds) P.cds[k] -= dt;
    let changed = false;
    for (const b of P.buffs) { b.t -= dt; if (b.mods && b.mods.hot) P.hp = Math.min(P.mhp, P.hp + b.mods.hot * dt); if (b.t <= 0) changed = true; }
    if (changed) { P.buffs = P.buffs.filter(b => b.t > 0); recalc(P); }
    // regeneráció
    if (P.combatT <= 0 || st.regen > 0) P.hp = Math.min(P.mhp, P.hp + st.regen * dt * (P.combatT > 0 ? 0.5 : 2));
    ResState.tick(P, dt); Focus.tick(P, dt);
    if (C.rage) { if (P.combatT <= -(st.verszomj ? 2 + st.verszomj : 0)) P.mp = Math.max(0, P.mp - 6 * dt); if (st.arti) P.mp = Math.min(P.mmp, P.mp + 1.2 * st.arti * dt); }
    else P.mp = Math.min(P.mmp, P.mp + st.mregen * dt);
    // az állóképesség kitérés/sprint után rövid ideig nem töltődik: a kitérés költségvetés, nem pánikgomb
    if (!(P.sprinting) && !(P.dash) && !(P.staDelay > 0)) P.sta = Math.min(P.msta, P.sta + st.staRegen * dt * (S.surv.ebren < 30 ? 0.5 : 1));
    if (st.shieldPct) { P.shieldT += dt; if (P.shieldT > 8) P.shieldV = Math.min(P.mhp * st.shieldPct / 100, P.shieldV + P.mhp * st.shieldPct / 100 * dt * 0.5); }
    // Golyóidő

const Quests = {
  st(id) { return G.S.quests[id]; },
  available(npc) { return QUESTS.filter(q => q.giver === npc && !this.st(q.id) && (!q.req || (this.st(q.req) && this.st(q.req).st === 'leadva'))); },
  active() { return QUESTS.filter(q => this.st(q.id) && this.st(q.id).st !== 'leadva'); },
  accept(id) { G.S.quests[id] = { st: 'aktiv', n: 0 }; const q = QUEST[id]; UI.toast(`Új küldetés: ${q.nev}`, '#ffd34d', 3); Audio2.play('ui'); this.recheck(); UI.dirty = true; },
  ensureStart() { if (!G.S.quests.m1) this.accept('m1'); },
  progress(q, n = 1) {
    const s = this.st(q.id); if (!s || s.st !== 'aktiv') return;
    s.n = Math.min(q.goal.n || 1, s.n + n);
    if (s.n >= (q.goal.n || 1)) { s.st = 'kesz'; UI.toast(`✔ Küldetés teljesítve: ${q.nev} – vidd vissza: ${NPCS[q.giver].nev}`, '#9fe07a', 5); Audio2.play('legend'); }
    else if (q.goal.n > 1) UI.toast(`${q.nev}: ${s.n}/${q.goal.n}`, '#e8dcc0', 1.5);
    UI.dirty = true;
  },
  recheck() { // a már meglévő állapotból azonnal teljesíthetők
    for (const q of this.active()) { const s = this.st(q.id); if (s.st !== 'aktiv') continue; if (q.goal.t === 'boss' && G.S.prog.bosses[q.goal.id]) this.progress(q); if (q.goal.t === 'ancient' && Object.keys(G.S.prog.ancients).length >= q.goal.n) this.progress(q, q.goal.n); if (q.goal.t === 'mat' && (G.S.mats[q.goal.id] || 0) >= q.goal.n) { s.n = q.goal.n; this.progress(q, 0); } }
  },
  on(ev, d) {
    if (!G.S) return;
    for (const q of this.active()) {
      const s = this.st(q.id); if (s.st !== 'aktiv') continue; const g = q.goal;
      if (ev === 'boss' && g.t === 'boss' && g.id === d) this.progress(q);
      else if (ev === 'kill' && g.t === 'kill' && d.type === g.id) this.progress(q);
      else if (ev === 'named' && g.t === 'named' && g.id === d) this.progress(q);
      else if (ev === 'eat' && g.t === 'eat') this.progress(q);
      else if (ev === 'gather' && g.t === 'gather' && d === g.id) this.progress(q);
      else if (ev === 'craft' && g.t === 'craft') this.progress(q);
      else if (ev === 'hive' && g.t === 'hive') this.progress(q);
      else if (ev === 'gate' && g.t === 'gate' && d === g.id) this.progress(q);
      else if (ev === 'buborek' && g.t === 'buborek') this.progress(q);
      else if (ev === 'kill' && g.t === 'ancient' && d.ancient) this.progress(q);
      else if (ev === 'mat' && g.t === 'mat' && d === g.id && (G.S.mats[g.id] || 0) >= g.n) { s.n = g.n; this.progress(q, 0); }
    }
    if (ev === 'kill') Bounty.on('kill', d); if (ev === 'gather') Bounty.on('gather', d); if (ev === 'enter') Bounty.on('enter', d);
  },
  complete(id) {
    const q = QUEST[id], s = this.st(id), S = G.S; if (!s || s.st !== 'kesz') return;
    if (q.goal.t === 'mat' && q.goal.take) { if ((S.mats[q.goal.id] || 0) < q.goal.n) { UI.toast('Nincs nálad elég.', '#ff7a7a'); return; } S.mats[q.goal.id] -= q.goal.n; }
    s.st = 'leadva'; const r = q.rw;
    if (r.xp) G.gainXp(r.xp); if (r.gold) S.gold += r.gold; if (r.skill) S.skillPts += r.skill; if (r.attr) S.attrPts += r.attr; if (r.potLvl) S.potLvl += r.potLvl;
    if (r.food) for (const k in r.food) S.food[k] = (S.food[k] || 0) + r.food[k];
    if (r.elix) for (const k in r.elix) S.elix[k] = (S.elix[k] || 0) + r.elix[k];
    if (r.mats) for (const k in r.mats) S.mats[k] = (S.mats[k] || 0) + r.mats[k];
    if (r.gate && !S.gates.includes(r.gate)) { S.gates.push(r.gate); S.gate = S.gate || r.gate; UI.toast(`Új Kapukő-képesség: ${GATESKILLS[r.gate].nev} (V)`, '#d27bff', 5); }
    const give = it => { if (S.inv.length < INV_MAX) S.inv.push(it); else S.stash.push(it); UI.toast(`Jutalom: ${it.nev}`, RARITY[it.rar].c, 4); };
    if (r.item) give(genItem(Math.max(S.lvl, 3), RNG, { ...r.item, cls: S.cls, rar: r.item.rar }));
    if (r.relic) give(genItem(Math.max(S.lvl, RELICS.find(x => x.id === r.relic).minL), RNG, { relic: r.relic }));
    Audio2.play('level'); UI.toast(`Leadva: ${q.nev}${r.xp ? ` · +${fmt(r.xp)} TP` : ''}${r.gold ? ` · +${fmt(r.gold)} arany` : ''}${r.skill ? ` · +${r.skill} képességpont` : ''}`, '#ffd34d', 5);
    if (id === 's_toredek') UI.toredekReveal();
    recalc(G.P); G.autosave(); UI.dirty = true;
  },
  pickQuestItem(id) {
    const S = G.S, Q = QITEMS[id]; S.qi = S.qi || {}; S.qi[id] = (S.qi[id] || 0) + 1;
    UI.toast(`${Q.ikon} ${Q.nev}`, Q.c, 3);
    if (id === 'toredek' && G.map) { const w = TOREDEK_SZO[G.map.rid]; if (w) { S.flags['toredek_' + G.map.rid] = 1; UI.toast(`📻 A töredék egy szót ismétel: „${w}”`, '#4dffb0', 5); } }
    if (id === 'cetli') UI.toast('📜 „Ha engem nem várt meg, téged se várjon.” – Bodor', '#e8dcc0', 6);
    for (const q of this.active()) if (q.goal.t === 'collect' && q.goal.id === id) this.progress(q);
  },
  populateHook(m, R, rng) {
    const S = G.S; if (m.hasadek) return;
    for (const q of this.active()) {
      const s = this.st(q.id); if (s.st !== 'aktiv') continue; const g = q.goal;
      if (g.where && g.where[m.rid] && g.where[m.rid].includes(m.floor)) {
        if (g.t === 'collect') {
          if (g.id === 'toredek' && S.flags['toredek_' + m.rid]) continue;
          const left = g.n - s.n; const n = Math.min(left, g.per || 1);
          const rooms = m.rooms.filter(r => !r.start);
          for (let i = 0; i < n; i++) { const r = rng.pick(rooms); const p = roomSpot(m, r, rng, 2); G.pickups.push({ kind: 'quest', v: g.id, x: p.x, y: p.y, t: 1, vy: 0, z: 0, glow: true }); }
        } else if (g.t === 'named') {
          const rooms = m.rooms.filter(r => !r.start && !r.exit).sort((a, b) => b.w * b.h - a.w * a.h); const r = rooms[0] || m.rooms[0]; const p = roomSpot(m, r, rng, 2);
          const N = NAMED[g.id]; const e = G.spawnEnemy(N.base, p.x, p.y, m.lvl + 2, { named: g.id, mods: N.mods });
        }
      }
    }
  },
  lootHook(e, drop) {
    for (const q of this.active()) {
      const s = this.st(q.id); if (s.st !== 'aktiv') continue; const g = q.goal;
      if (g.t === 'collect' && g.eliteDrop && (e.elite || e.champion || e.named || e.boss) && RNG() < g.eliteDrop) drop('quest', g.id);
      if (g.t === 'collect' && g.enemyDrop && g.enemyDrop[e.type] && RNG() < g.enemyDrop[e.type]) drop('quest', g.id);
    }
    // bőr az állatszerű lényekből
    if (['beast', 'bug', 'worm', 'turtle', 'bee', 'bird'].includes(e.look.s) && RNG() < (e.elite ? 0.5 : 0.12)) drop('mat', 'bor');
    if (RNG() < (e.boss ? 1 : e.elite ? 0.25 : 0.03)) drop('mat', RNG.pick(['vas', 'fa', 'kristaly', 'vaszon', 'gyogyfu']));
  },
};

// ---------------- Hirdetőtábla (napi megbízások) ----------------
const Bounty = {
  ensure() {
    const S = G.S, day = new Date().toISOString().slice(0, 10);
    if (S.bountyDay === day && S.bounties.length) return;
    S.bountyDay = day; S.bounties = []; const rng = makeRng(hashStr(day + S.created));
    const regs = REGIONS.filter(r => S.prog.unlocked.includes(r.id));
    for (let i = 0; i < 4; i++) {
      const R = rng.pick(regs), k = rng.int(0, 3); let b;
      if (k === 0) { const t = rng.pick(R.enemies); b = { t: 'kill', id: t, rid: R.id, n: rng.int(20, 40), nev: `Irts ki ${'{n}'} ${ENEMIES[t].nev.toLowerCase()} lényt (${R.nev})` }; }
      else if (k === 1) b = { t: 'elite', rid: R.id, n: rng.int(4, 8), nev: `Győzz le ${'{n}'} elit vagy bajnok ellenfelet (${R.nev})` };
      else if (k === 2) { const mt = rng.pick(['vas', 'fa', 'gyogyfu', 'kristaly', 'vaszon']); b = { t: 'gather', id: mt, n: rng.int(5, 10), nev: `Gyűjts ${'{n}'} ${MATS[mt].nev.toLowerCase()} anyagot` }; }
      else b = { t: 'enter', rid: R.id, n: 1, floor: R.floors, nev: `Juss le: ${R.nev}, ${R.floors}. szint` };
      b.nev = b.nev.replace('{n}', b.n); b.p = 0; b.done = false; b.lvl = Math.max(S.lvl, R.lvl + 3);
      b.rw = { xp: Math.round(xpNeed(b.lvl) * 0.18), gold: Math.round(40 + b.lvl * 18), szilank: rng.int(2, 5) };
      S.bounties.push(b);
    }
  },
  on(ev, d) {
    const S = G.S; if (!S || !S.bounties) return;
    for (const b of S.bounties) {
      if (b.done || b.p >= b.n) continue;
      if (ev === 'kill' && b.t === 'kill' && d.type === b.id && G.map.rid === b.rid) b.p++;
      if (ev === 'kill' && b.t === 'elite' && (d.elite || d.champion || d.named) && G.map.rid === b.rid) b.p++;
      if (ev === 'gather' && b.t === 'gather' && d === b.id) b.p++;
      if (ev === 'enter' && b.t === 'enter' && d.rid === b.rid && d.floor >= b.floor) b.p = 1;
      if (b.p >= b.n) UI.toast(`📋 Megbízás kész: ${b.nev} – vedd fel a jutalmat a hirdetőtáblánál.`, '#9fe07a', 4);
    }
  },
  claim(i) { const S = G.S, b = S.bounties[i]; if (!b || b.done || b.p < b.n) return; b.done = true; G.gainXp(b.rw.xp); S.gold += b.rw.gold; S.mats.szilank = (S.mats.szilank || 0) + b.rw.szilank; Audio2.play('gold'); UI.toast(`Jutalom: +${fmt(b.rw.xp)} TP, +${b.rw.gold} arany, +${b.rw.szilank} kapuszilánk`, '#ffd34d', 4); UI.dirty = true; },
};

    const H = Home.S(), S = G.S;
    if (H.owned) { this.dlgState.line = 'A telked a lakónegyedben van, a város keleti kapuján túl. Ott az otthonod.'; this.renderDlg(); return; }
    const cost = 600; if (S.gold < cost) { this.dlgState.line = `Egy telek ${cost} arany. Raktárvezetőként mondom: előbb a készlet, aztán a beruházás.`; this.renderDlg(); return; }
    S.gold -= cost; H.owned = true; H.cells = Home.starter(); Audio2.play('legend'); this.dlgState.line = 'Gratulálok, mostantól van hová hazajönnöd. A kulcs a keleti kapunál, a lakónegyedben. Kaptál egy kis kezdőházat is – építsd tovább (U).'; this.renderDlg(); UI.toast('🏡 Telket vettél! Lakónegyed: a város keleti szélén.', '#9fe07a', 5); G.autosave();
  },
  hmGift(d) {
    const S = G.S, N = NPCS[d.id], r = Home.rel(d.id);
    const opts = N.likes.filter(m => (S.mats[m] || 0) > 0);
    let txt;
    if (opts.length) { const m = opts[0]; S.mats[m]--; r.p = Math.min(100, r.p + 12); txt = `Ezt nekem? ${MATS[m].nev}! Pont erre vágytam.`; }
    else if (S.gold >= 25) { S.gold -= 25; r.p = Math.min(100, r.p + 5); txt = 'Köszönöm, kedves vagy. (Egy kedvenc alapanyaga jobban örülne.)'; }
    else { txt = 'Nem kell semmi, tényleg. De azért egyszer hozhatnál valamit.'; this.dlgState.line = txt; this.renderDlg(); return; }
    r.gift = Home.day(); Audio2.play('pickup'); this.dlgState.line = txt; this.renderDlg();
  },
  hmDate(d) { const S = G.S, r = Home.rel(d.id), N = NPCS[d.id]; if (S.gold < 30) return; S.gold -= 30; r.date = Home.day(); r.p = Math.min(100, r.p + 10); Audio2.play('legend'); this.dlgState.line = RNG.pick(['Sétáltunk a Kapu körül. A fények úgy keringtek, mintha nekünk játszanának.', 'Néztük, ahogy a Kapuban átúszik egy másik világ égboltja. Szép volt.', 'Elmeséltem az egyik kalandomat. Úgy nevetett, hogy a Kurta is átjött megnézni, mi van.', 'Kurta a szomszéd asztalnál böfögött. Mégis ez volt az eddigi legjobb esténk.']); this.renderDlg(); },
  hmPropose(d) {
    const S = G.S, N = NPCS[d.id], H = Home.S();
    const ri = S.inv.findIndex(it => it.base === 'gyuru' && it.rar >= 2);
    if (ri < 0) { this.dlgState.line = 'Gyűrű nélkül? (Kell egy ritka vagy jobb gyűrű a táskádban.)'; this.renderDlg(); return; }
    if (!H.owned || !Home.has().alvas) { this.dlgState.line = 'Hová költöznénk? Előbb legyen egy otthon, benne egy ággyal.'; this.renderDlg(); return; }
    const ring = S.inv.splice(ri, 1)[0]; S.spouse = d.id; Home.rel(d.id).p = 100;
    Audio2.play('legend'); setTimeout(() => Audio2.play('level'), 500);
    this.dlgState.line = `Igen. Igen! – ${N.nev} felhúzza a ${ring.nev}-t. Mostantól közös az otthonotok. (${N.perk.nev}: ${N.perk.desc})`; this.renderDlg();
    UI.toast(`💍 Összeházasodtál: ${N.nev}! Beköltözik az otthonodba.`, '#ff9be0', 6); Univ.set('kp:hazassag'); recalc(G.P); G.autosave();
  },
  hmSpouse(d) { const N = NPCS[d.id]; this.dlgState.line = RNG.pick(['Vigyázz magadra odakint. Itthon várlak.', 'Ma este te főzöl? Nem? Gondoltam.', 'Ha a Kapu túloldalán jársz, hozz nekem valamit. Bármit.', `${N.perk.nev} – ezt csak neked.`]); this.renderDlg(); },
  hmBuildOff() { Home.build = false; $('#pShop').style.display = 'none'; UI.open = null; },
  hmKat(d) { Home.kat = d.k; const first = Object.keys(BUILD).find(k => BUILD[k].kat === d.k); if (first) Home.sel = first; Home.palette(); },
  hmSel(d) { Home.sel = d.id; Home.palette(); },
  hmCook(d) { const S = G.S, R0 = HOME_RECIPES[d.id]; if (!Object.keys(R0.mats).every(m => (S.mats[m] || 0) >= R0.mats[m]) || S.gold < (R0.gold || 0)) return; for (const m in R0.mats) S.mats[m] -= R0.mats[m]; S.gold -= R0.gold || 0; if (R0.give) S.food[R0.give] = (S.food[R0.give] || 0) + (R0.n || 1); if (R0.food) { const sv = S.surv; if (R0.food.kaja) sv.kaja = Math.min(100, sv.kaja + R0.food.kaja); if (R0.food.ital) sv.ital = Math.min(100, sv.ital + R0.food.ital); if (R0.food.alvas) sv.ebren = Math.min(100, sv.ebren + R0.food.alvas); } if (R0.buff) G.buff(G.P, 'gulyas', R0.buff.t, R0.buff.mods); recalc(G.P); Audio2.play('potion'); UI.toast(`${R0.ikon} ${R0.nev} elkészült.`, '#e8d7b0'); this.renderShop(); },
});
Home.starter = function () {
  // kis kezdőház: 6×5 gerendafal, parketta, ajtó, ágy
  const c = {}; const x0 = 11, y0 = 5, w = 7, h = 6;
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) { const k = x + ',' + y; const edge = x === x0 || y === y0 || x === x0 + w - 1 || y === y0 + h - 1; c[k] = edge ? { w: 'fafal' } : { f: 'parketta' }; }
  c[(x0 + 3) + ',' + (y0 + h - 1)] = { w: 'ajto', f: 'parketta' };
  c[(x0 + 1) + ',' + (y0 + 1)].o = 'agy'; c[(x0 + 5) + ',' + (y0 + 1)].o = 'asztal'; c[(x0 + 4) + ',' + (y0 + 1)].o = 'szek';
  return c;
};

// ============================================================
//  FŐMENÜ, KARAKTERKÉSZÍTÉS, FŐCIKLUS
// ============================================================
const Menu = {
  sel: 'penge',
  show() {
    G.scene = 'menu'; $('#hud').style.display = 'none'; const m = $('#menu'); m.style.display = 'flex';
    let h = `<div class="box"><h1 class="title h">KAPUK</h1><div class="sub">Multiverzum RPG · a világok közötti város · v${VERZIO}</div><div class="slots">`;
    for (let i = 0; i < 3; i++) {
      const S = Save.read(i);
      h += S ? `<div class="slot" data-a="load" data-i="${i}"><div class="h" style="font-size:17px">${esc(S.nev)}</div><div>${CLASSES[S.cls].ikon} ${CLASSES[S.cls].nev} · ${S.lvl}. szint</div><div class="small">${Math.floor(S.playtime / 3600)} ó ${Math.floor(S.playtime % 3600 / 60)} p · ${S.prog.unlocked.length} világ · ${S.pecset} pecsét</div><div style="margin-top:6px"><button class="sm" data-a="load" data-i="${i}">Folytatás</button> <button class="sm" data-a="delSlot" data-i="${i}">Törlés</button></div></div>`
        : `<div class="slot" data-a="newSlot" data-i="${i}"><div class="h" style="font-size:17px">Üres hely</div><div class="small" style="margin-top:20px">+ Új karakter</div></div>`;
    }
    h += `</div><div class="small">A játék mentése a böngésződben él. A többi játékommal közös naplót vezet: ha ugyanazon a webcímen játszottál már az Eseményhorizonttal, a Mélységgel, a Kurtával vagy a többivel, itt ajándék vár.</div></div>`;
    m.innerHTML = h;
  },
  newChar(i) {
    this.slot = i; const m = $('#menu');
    let h = `<div class="box"><h2 class="h" style="font-size:30px">Új karakter</h2><div class="clsg">`;
    for (const k in CLASSES) { const C = CLASSES[k], R = RESOURCES[k]; h += `<div class="cls ${this.sel === k ? 'on' : ''}" data-a="pickCls" data-c="${k}"><div class="i" style="color:${C.szin}">${C.ikon}</div><div class="h" style="font-size:15px">${C.nev}</div><div style="margin:4px 0">${C.leiras}</div><div class="small" style="color:${R.c}">${R.ikon} ${R.nev}: ${R.desc}</div></div>`; }
    h += `</div><div style="margin:10px 0"><input id="cname" maxlength="20" placeholder="A hősöd neve" value="${esc(localStorage.getItem('multiverzum-nev') || '')}"> <button class="pri" data-a="create">Indulás</button> <button data-a="back">Vissza</button></div></div>`;
    m.innerHTML = h;
  },
};
Object.assign(UI.acts, {
  load(d) { const S = Save.read(+d.i); if (!S) return; Menu.startWith(S, +d.i); },
  newSlot(d) { Menu.newChar(+d.i); },
  delSlot(d, e) { e.stopPropagation(); if (confirm('Biztosan törlöd ezt a karaktert?')) { Save.del(+d.i); Menu.show(); } },
  pickCls(d) { Menu.sel = d.c; Menu.newChar(Menu.slot); },
  create() { const nev = ($('#cname').value || '').trim() || 'Vándor'; const S = newSave(Menu.sel, nev); Save.write(Menu.slot, S); Menu.startWith(S, Menu.slot); },
  back() { Menu.show(); },
  resume() { UI.closeAll(); },
  quitMenu() { G.autosave(); UI.closeAll(); G.scene = 'menu'; G.map = null; Menu.show(); },
  vol(d, e) { Audio2.setVol(+e.target.value); },
  mute() { Audio2.muted = !Audio2.muted; Audio2.setVol(Audio2.vol); UI.acts.menuOpen.call(UI); },
  menuOpen() {
    UI.closeAll(); UI.open = 'pMenu'; G.paused = true; $('#pMenu').style.display = 'block';
    $('#pMenu').innerHTML = UI.hd('Menü') + `<div class="bd"><div class="dlg-opts"><button class="pri" data-a="resume">Folytatás</button><button data-a="help">Súgó és billentyűk</button><button data-a="mute">${Audio2.muted ? 'Hang be' : 'Hang ki'}</button><div class="row"><span>Hangerő</span><input type="range" min="0" max="1" step="0.05" value="${Audio2.vol}" oninput="this.dispatchEvent(new CustomEvent('volc',{bubbles:true}))" id="volr"></div><button data-a="export">Mentés exportálása</button><button data-a="import">Mentés importálása</button><button data-a="quitMenu">Mentés és kilépés a főmenübe</button></div><div class="small" style="margin-top:8px">Automatikus mentés 30 másodpercenként és minden pályaváltáskor.</div></div>`;
    $('#volr').addEventListener('input', e => Audio2.setVol(+e.target.value));
  },
  help() {
    UI.closeAll(); UI.open = 'pMenu'; G.paused = true; $('#pMenu').style.display = 'block';
    $('#pMenu').innerHTML = UI.hd('Súgó') + `<div class="bd small" style="font-size:12px;line-height:1.6;color:var(--tx)">
<b class="h">Irányítás</b><br>WASD – mozgás · egér – célzás · bal gomb – alaptámadás (a fegyvered szerint közelharc, mágia vagy lövés) · jobb gomb és 1–4 – képességek · V – Kapukő-képesség · Space – kitérés (állóképesség) · Shift – sprint<br>E – beszélgetés, láda, gyűjtés · Q – gyógyital · 6/7/8/9 – elixírek · B – artefaktum · H – evés · G – ivás · N – sátor · T – kapu haza (csatornázás)<br>I – táska · C – karakter · K – képességek · J – napló · M – térkép · Alt – tárgycímkék · Esc – menü<br>Az Eseményhorizontban: Z / X – eltolás a W-tengelyen
<br><br><b class="h">Fejlődés</b><br>Szintenként 5 tulajdonságpont (Erő, Ügyesség, Akarat, Kitartás, Állóképesség) és 1 képességpont. A világok urai Kapukő-képességet adnak. Az Ősök – a világok 2–3. szintjén kóborló, 25–40 szinttel erősebb lények – Tiltott pecsétet, a pecsétek szándékosan túl erős Tiltott képességeket.
<br><br><b class="h">Túlélés</b><br>Éhség, szomjúság és fáradtság. 30 alatt gyengülsz, nullán sebződsz. Ételt és italt a szörnyek is ejtenek; Nagyi és Kurta árulnak. Alvás: kocsma vagy sátor (N) egy kitakarított teremben.
<br><br><b class="h">Kézművesség</b><br>Az alapanyagot a kazamatákban gyűjtöd (ércér, fakupac, gyógyfű, kristálytelér, vászonbála – E), bőrt az állatszerű lényektől. A Főkonstruktőr készít belőle tárgyat, minden világ saját anyagával egy fokkal jobbat. Nagyi elixírt főz.
<br><br><b class="h">Multiverzum</b><br>A játék a szerző többi játékával közös naplót vezet (univerzum-naplo). Amit ott elértél, itt ajándékot ad, és a város lakói emlékeznek rá.</div>`;
  },
  export() { const s = JSON.stringify(G.S); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s], { type: 'application/json' })); a.download = `kapuk-${G.S.nev}.json`; a.click(); },
  import() { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json'; i.onchange = async () => { try { const S = JSON.parse(await i.files[0].text()); Save.migrate(S); Save.write(G.slot, S); location.reload(); } catch (e) { UI.toast('Hibás mentésfájl.', '#ff7a7a'); } }; i.click(); },
});
Menu.startWith = function (S, slot) {
  $('#menu').style.display = 'none'; $('#hud').style.display = 'block'; Audio2.unlock();
  G.start(S, slot); UI.dirty = true;
  if (/github\.io$/.test(location.hostname)) Univ.connect();
};

// ---------- billentyűk ----------
function handleKeys() {
  if (G.scene !== 'play') return;
  const k = Input;
  if (k.hit('Escape')) { if ($('#over').style.display === 'flex') { } else if (Home.build) UI.acts.hmBuildOff(); else if (UI.open) UI.closeAll(); else UI.acts.menuOpen.call(UI); }
  if (k.hit('i')) UI.toggle('pInv', UI.renderInv);
  if (k.hit('c')) UI.toggle('pChar', UI.renderChar);
  if (k.hit('k')) UI.toggle('pSkill', UI.renderSkills);
  if (k.hit('j')) UI.toggle('pQuest', UI.renderQuest);
  if (k.hit('m')) UI.toggle('pMap', UI.renderMap);
  if (k.hit('F1')) { UI.keyHelp = !UI.keyHelp; UI.dirty = true; }
  if (k.hit('u')) Home.toggleBuild();
  if ((UI.open && UI.open !== 'build') || G.paused || G.P.dead) return;
  if (k.hit('e')) G.interact();
  if (k.hit('q')) G.drinkPotion();
  if (k.hit('h')) autoEat('kaja');
  if (k.hit('g')) autoEat('ital');
  if (k.hit('n')) G.pitchTent();
  if (k.hit('t')) G.townPortal();
  if (k.hit('b')) useArtifact();
  for (const id in ELIX) if (k.hit(ELIX[id].key)) drinkElix(id);
  if (k.hit('5') && G.S.slots[0]) G.useSlot(0);
}

// ---------- főciklus ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try {
    if (G.scene === 'play' && G.map) {
      handleKeys();
      if (!G.paused && $('#over').style.display !== 'flex') G.update(dt);
      else if (UI.sleepT > 0) { }
      if (UI.sleepT > 0) UI.sleepT -= dt;
      R.frame(); UI.hud();
    }
  } catch (e) { console.error(e); if (!loop.err) { loop.err = 1; UI.toast('Hiba: ' + e.message, '#ff5555', 8); } }
  Input.endFrame();
  requestAnimationFrame(loop);
}

// ---------- indulás ----------
function boot() {
  const c = $('#c'); Input.init(c); R.init(c); UI.init();
  Menu.show();
  requestAnimationFrame(loop);
  addEventListener('beforeunload', () => G.autosave());
  window.__G = G; window.__eval = s => eval(s); // hibakereséshez
}
boot();

</script>
</body>
